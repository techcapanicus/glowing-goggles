name: Deploy Webchat Hub to GitHub Pages

on:
  push:
    branches: [main, cursor/webchat-hub-ba6f]
    paths:
      - 'webchat-hub/**'
      - '.github/workflows/webchat-hub-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webchat-hub-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webchat-hub/package-lock.json

      - name: Install and build
        working-directory: webchat-hub
        env:
          VITE_BASE_PATH: /glowing-goggles/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webchat-hub/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
