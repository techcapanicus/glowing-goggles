<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="2;url=https://ringcx.ringcentral.com/" />
    <title>Signing in…</title>
    <style>
        body {
            font-family: Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f6f7;
            color: #1f1f1f;
        }
        .box {
            text-align: center;
            padding: 32px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e5e5;
            border-top-color: #066fac;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner" aria-hidden="true"></div>
        <p>Signing you in to RingCX…</p>
    </div>
</body>
</html>
