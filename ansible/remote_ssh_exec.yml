---
- name: SSH to droplet using working controller key
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Run command on 64.23.139.247
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=no
          - -o
          - ConnectTimeout=15
          - -i
          - /root/.ssh/id_ed25519
          - root@64.23.139.247
          - "{{ remote_command | default('hostname && id') }}"
      register: remote_out
      changed_when: false
      failed_when: false

    - name: Show remote output
      ansible.builtin.debug:
        msg:
          - "exit_code: {{ remote_out.rc }}"
          - "stdout: {{ remote_out.stdout_lines | default([]) }}"
          - "stderr: {{ remote_out.stderr_lines | default([]) }}"
