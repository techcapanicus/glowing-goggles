---
# Idempotent SSH key provisioning playbook.
#
# Connects as the bootstrap user (configured on the inventory's SSH key),
# escalates with sudo, and adds `new_public_key` to the target user's
# authorized_keys with correct permissions. Uses only ansible.builtin modules
# (no external collections). Kept in sync with the heredoc embedded in
# ../provision_ssh.py.
- name: Provision SSH key access
  hosts: all
  gather_facts: false
  become: true
  vars:
    target_user: "{{ target_user | mandatory }}"
    new_public_key: "{{ new_public_key | mandatory }}"
    ssh_dir: >-
      {{ '/root/.ssh' if target_user == 'root'
         else '/home/' + target_user + '/.ssh' }}
  tasks:
    - name: Ensure the target user exists
      ansible.builtin.user:
        name: "{{ target_user }}"
        state: present
      when: target_user != 'root'

    - name: Ensure the .ssh directory exists with correct permissions
      ansible.builtin.file:
        path: "{{ ssh_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0700"

    - name: Ensure authorized_keys exists with correct permissions
      ansible.builtin.file:
        path: "{{ ssh_dir }}/authorized_keys"
        state: touch
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: Add the public key (idempotent, no duplicates)
      ansible.builtin.lineinfile:
        path: "{{ ssh_dir }}/authorized_keys"
        line: "{{ new_public_key }}"
        state: present
        create: false
        insertafter: EOF
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
