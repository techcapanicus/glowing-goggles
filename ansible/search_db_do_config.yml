---
# Search MySQL and MongoDB for DigitalOcean / firewall API configuration.
- name: Search databases for DigitalOcean config
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Install mysql client if needed
      ansible.builtin.apt:
        name: default-mysql-client
        state: present
        update_cache: true
      failed_when: false

    - name: Install pymongo if needed
      ansible.builtin.pip:
        name: pymongo
        state: present
        executable: pip3
      failed_when: false

    - name: Verify search script exists on controller checkout
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../scripts/search_db_do_config.py"
      register: search_script

    - name: Run database DO/firewall search
      ansible.builtin.shell: |
        set -o pipefail
        python3 "{{ playbook_dir }}/../scripts/search_db_do_config.py"
      args:
        executable: /bin/bash
      register: db_search
      changed_when: false
      failed_when: false

    - name: Print database search report
      ansible.builtin.debug:
        msg:
          - "script exists: {{ search_script.stat.exists | default(false) }}"
          - "rc: {{ db_search.rc | default('?') }}"
          - "stdout: {{ db_search.stdout | default('') }}"
          - "stderr: {{ db_search.stderr | default('') }}"
